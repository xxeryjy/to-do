<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title data-i18n="app.widgetTitle">Desktop TODO · Widget</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --widget-bg: #15171C;
      --widget-line: #2A2E36;
      --widget-text: #F5F7FA;
      --widget-accent: #14B8A6;
      --widget-track: #2A2E36;
      --widget-shadow: rgba(0, 0, 0, 0.32);
    }
    :root[data-theme="candy"] {
      --widget-bg: rgba(255, 253, 252, 0.96);
      --widget-line: #F0D8E3;
      --widget-text: #3C2733;
      --widget-accent: #FF6FAE;
      --widget-track: #F4DCE6;
      --widget-shadow: rgba(159, 88, 122, 0.24);
    }
    :root[data-theme="light"] {
      --widget-bg: rgba(255, 255, 255, 0.96);
      --widget-line: #D5DBE2;
      --widget-text: #1D1D1F;
      --widget-accent: #5F8A70;
      --widget-track: #E6EAF0;
      --widget-shadow: rgba(36, 48, 60, 0.18);
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    .widget {
      width: 170px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border: 1px solid var(--widget-line);
      border-radius: 16px;
      background: var(--widget-bg);
      box-shadow: 0 4px 12px var(--widget-shadow);
      cursor: grab;
      -webkit-app-region: drag;
    }
    .widget:active { cursor: grabbing; }
    .w-play {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 22px;
      border-radius: 6px;
      background: var(--widget-accent);
      color: var(--widget-text);
      font-family: Inter, sans-serif;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .w-track {
      position: relative;
      min-width: 0;
      height: 10px;
      flex: 1;
      overflow: hidden;
      border-radius: 5px;
      background: var(--widget-track);
    }
    .w-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--widget-accent);
      transition: width 0.25s linear;
    }
    .w-time {
      min-width: 27px;
      color: var(--widget-text);
      font-family: 'Inter Tight', Inter, sans-serif;
      font-size: 9px;
      font-weight: 600;
      text-align: right;
      font-variant-numeric: tabular-nums;
      -webkit-app-region: no-drag;
    }
    .w-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #7A8290;
    }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="w-play" id="wPlay" title="Start or pause" data-i18n-title="widget.startPause">Ⅱ</div>
    <div class="w-track"><div class="w-fill" id="wFill"></div></div>
    <div class="w-time" id="wTime">25:00</div>
    <div class="w-dot" id="wDot"></div>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/widget.js"></script>
</body>
</html>
